<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23252ce5'/%3E%3C/svg%3E"><title>ROOM — Composition studies</title><style>@font-face{font-family:'Uncut Sans';src:url('/fonts/UncutSans-Variable.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#111114;color:#efeedb;font-family:'Uncut Sans',sans-serif}nav{min-height:62px;display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid #494950;flex-wrap:wrap}b{margin-right:auto;font-size:25px;letter-spacing:-1px}button,a{padding:9px 12px;border:1px solid #69696d;color:inherit;background:transparent;text-decoration:none;cursor:pointer;font:12px inherit}button[aria-pressed=true]{background:#edff52;color:#111114}#scene{height:calc(100dvh - 62px)}@media(max-width:600px){nav{padding:10px 14px}b{width:100%;font-size:19px}button,a{font-size:10px;padding:6px}#scene{height:calc(100dvh - 94px)}}</style></head><body><nav><b>ROOM / Composition studies</b><button data-view="floor">01 전체 콜라주</button><button data-view="close">02 가까이 보기</button><button data-view="graphic">03 넓게 보기</button><a href="/?edit=1">편집기 ↗</a></nav><div id="scene"></div><script type="module">
import {RoomRenderer} from './src/editor/renderer.js';import {INITIAL_ROOMS} from './src/editor/templates.js';import {parseRoom} from './src/editor/room-code.js';await document.fonts.load('700 30px "Uncut Sans"');const world=new RoomRenderer(document.querySelector('#scene'));const data=parseRoom(INITIAL_ROOMS[0].source).scene;world.apply(data);function set(view){view=['floor','close','graphic'].includes(view)?view:'floor';world.apply({...data,composition:view},{resetView:true});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));}document.querySelector('nav').onclick=e=>{if(e.target.dataset.view)set(e.target.dataset.view)};set(new URLSearchParams(location.search).get('view')||'floor');window.addEventListener('pagehide',()=>world.destroy());
</script></body></html>
