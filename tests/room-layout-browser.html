<!doctype html><html lang="ko"><meta charset="utf-8"><title>ROOM layout checks</title>
<style>body{margin:0;background:#333;color:#fff;font:12px monospace}nav{height:34px;display:flex;align-items:center;gap:12px;padding:0 12px}#frame{position:relative;margin:0 auto}iframe{display:block;border:0;width:390px;height:660px;transform-origin:top left}#result{white-space:pre-wrap;font-size:11px;padding:0 12px}</style>
<nav>ROOM <button data-width="390">390</button><button data-width="760">760</button><button data-width="1200">1200</button><button id="measure">Check layout</button></nav><div id="frame"><iframe id="preview" title="ROOM responsive preview" src="/"></iframe></div><pre id="result">390 × 660</pre>
<script>
const iframe=document.querySelector('iframe'),frame=document.querySelector('#frame'),result=document.querySelector('#result');let width=390;
function size(){const scale=Math.min(1,(innerWidth-24)/width);iframe.style.width=width+'px';iframe.style.transform=`scale(${scale})`;frame.style.width=width*scale+'px';frame.style.height=660*scale+'px';}size();window.onresize=size;
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{width=Number(button.dataset.width);size();result.textContent=width+' × 660';});
document.querySelector('#measure').onclick=()=>{
  const doc=iframe.contentDocument,space=doc.querySelector('#space-panel').getBoundingClientRect(),canvas=doc.querySelector('canvas').getBoundingClientRect(),footer=doc.querySelector('.app-footer').getBoundingClientRect();
  const panels=[...doc.querySelectorAll('[data-studio-window]:not([hidden])')].map(el=>{const r=el.getBoundingClientRect();return{id:el.id,dock:el.dataset.dock,width:r.width,height:r.height,overlap:Math.max(0,Math.min(space.right,r.right)-Math.max(space.left,r.left))*Math.max(0,Math.min(space.bottom,r.bottom)-Math.max(space.top,r.top))};});
  const code=doc.querySelector('#code-window'),apply=doc.querySelector('#run-code').getBoundingClientRect(),codeRect=code.getBoundingClientRect();
  const overlap=panels.filter(p=>p.dock!=='float').some(p=>p.overlap>1);
  const checks={viewport:space.width>=160&&space.height>=140,dockedPanelsDoNotCoverArtwork:!overlap,canvasMatchesViewport:Math.abs(canvas.width-space.width)<1&&Math.abs(canvas.height-space.height)<1,footerMeetsArtwork:Math.abs(footer.top-space.bottom)<1,footerFitsWidth:footer.right<=width+1,noPropertyWindow:!doc.querySelector('#properties-window'),codeApplyFits:code.hidden||(apply.bottom<=codeRect.bottom+1&&apply.right<=codeRect.right+1)};
  result.textContent=JSON.stringify({pass:Object.values(checks).every(Boolean),width,checks,viewport:{width:space.width,height:space.height},panels},null,2);
};
</script></html>
