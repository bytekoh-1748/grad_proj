<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CRAFT BOY — Interaction Cartridges</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Quantico:ital,wght@0,400;0,700;1,400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 방 — 선반(칩)과 게임기가 함께 서 있는 자리 -->
  <div class="room" id="room">

    <!-- 확대의 주체 — 여기만 화면 안으로 밀려 들어간다 -->
    <div class="stage" id="stage">

      <!-- 칩 — 오른쪽에서 파일 인덱스처럼 겹친다 -->
      <div class="rail" id="rail" role="listbox" aria-label="Interaction cartridges" tabindex="0"></div>

      <!-- 도크 — 왼쪽에 놓인 선화형 게임기. 카트리지는 오른쪽 옆면으로 들어간다 -->
      <div class="deck" id="deck">
        <div class="seat" id="seat" aria-hidden="true"></div>

        <div class="console" id="console">
          <span class="console-inset" aria-hidden="true"></span>
          <span class="screw screw-nw" aria-hidden="true"></span>
          <span class="screw screw-ne" aria-hidden="true"></span>
          <span class="screw screw-sw" aria-hidden="true"></span>
          <span class="screw screw-se" aria-hidden="true"></span>

          <div class="console-mark" aria-hidden="true">
            <strong>CRAFT BOY</strong>
            <span>INTERACTION DRIVE / MODEL 06</span>
          </div>

          <span class="port-guide" aria-hidden="true"></span>
          <span class="slot" aria-hidden="true"></span>

          <div class="bezel">
            <div class="lcd" id="lcd">
              <canvas id="lcd-cv"></canvas>
              <span class="lcd-grid" aria-hidden="true"></span>
            </div>
          </div>

          <div class="controls" aria-hidden="true">
            <span class="dpad"><i></i><i></i></span>
            <span class="control-key key-a">A</span>
            <span class="control-key key-b">B</span>
          </div>

          <div class="vent" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <span class="port-label" aria-hidden="true">SIDE LOAD / PUSH ←</span>
          <span class="led" id="led" aria-hidden="true"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- 날아가는 칩 한 장이 잠시 머무는 층 -->
  <div class="flight" id="flight" aria-hidden="true"></div>

  <!-- 화면 안 — 확대가 끝나면 여기서 인터랙션이 돈다 -->
  <section class="play" id="play" aria-hidden="true">
    <canvas id="play-cv"></canvas>
    <div class="play-hud">
      <p class="play-title" id="play-title"></p>
      <p class="play-hint" id="play-hint"></p>
    </div>
    <button class="eject" id="eject" type="button" aria-label="Close interaction">×</button>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
